// ===== sair: botão, 1h sem mexer, e nunca guarda a senha nas páginas públicas =====
function sair(){if(MODO==='caio')return;DADOS=null;SENHA='';
  document.getElementById('lista').innerHTML='';document.getElementById('painel').hidden=true;document.getElementById('trava').hidden=false;
  const i=document.getElementById('senha');i.value='';i.type='password';mostraOlho(false);document.getElementById('erro').textContent='';
  if(tentativas().n>=MAXT)travar();window.scrollTo(0,0)}
['pointerdown','keydown','scroll','touchstart'].forEach(t=>addEventListener(t,()=>{ULT=Date.now()},{passive:true}));
function confereInativo(){if(MODO!=='caio'&&DADOS&&Date.now()-ULT>36e5)sair()}
setInterval(confereInativo,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)confereInativo()});
const OLHO_A='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const OLHO_F='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function mostraOlho(v){const o=document.getElementById('olho');o.innerHTML=v?OLHO_F:OLHO_A;o.setAttribute('aria-label',v?'Ocultar senha':'Mostrar senha');o.setAttribute('aria-pressed',String(v))}
mostraOlho(false);
document.getElementById('olho').addEventListener('click',()=>{const i=document.getElementById('senha'),v=i.type==='password';i.type=v?'text':'password';mostraOlho(v);i.focus()});
document.getElementById('sair').addEventListener('click',sair);
// ===== trava por tentativas erradas (guardada no aparelho de quem abre) =====
const PAGINA='socios',LIBERADO=0,MAXT=5,KT='trava-'+PAGINA;
const LS={get(){try{return JSON.parse(localStorage.getItem(KT)||'null')}catch(_){return null}},set(v){try{localStorage.setItem(KT,JSON.stringify(v))}catch(_){}},del(){try{localStorage.removeItem(KT)}catch(_){}}};
function tentativas(){let t=LS.get();if(!t||typeof t.n!=='number')return {n:0,em:0};if(LIBERADO&&LIBERADO>=t.em){LS.del();return {n:0,em:0}}return t}
function travar(){document.getElementById('f').hidden=true;document.getElementById('travado').hidden=false}
const snack=t=>{document.getElementById('snacktx').textContent=t;document.getElementById('snack').hidden=false};
document.getElementById('snackx').onclick=()=>{document.getElementById('snack').hidden=true};
const ss={get(){try{return sessionStorage.getItem('painel-pw')||''}catch(_){return ''}},set(v){try{sessionStorage.setItem('painel-pw',v)}catch(_){}}};
async function entrar(pw){DADOS=await abrir(pw);SENHA=pw;if(MODO==='caio')ss.set(pw);ULT=Date.now();document.getElementById('sair').hidden=MODO==='caio';document.getElementById('trava').hidden=true;document.getElementById('painel').hidden=false;render(DADOS);window.scrollTo(0,0);mostraBotao()}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();const i=document.getElementById('senha'),er=document.getElementById('erro'),bt=document.getElementById('entrar');
  if(tentativas().n>=MAXT){travar();return}
  er.textContent='';bt.disabled=true;bt.textContent='Abrindo…';
  try{await entrar(i.value.trim());LS.del()}
  catch(_){const t=tentativas();t.n++;t.em=Date.now();LS.set(t);
    if(t.n>=MAXT){travar();return}
    const r=MAXT-t.n;er.textContent='Senha incorreta. '+(r===1?'Resta 1 tentativa.':'Restam '+r+' tentativas.');i.value='';i.focus()}
  finally{bt.disabled=false;bt.textContent='Entrar'}
});
// depois de atualizar a página recarrega: nesta aba não pede a senha de novo
(async()=>{
  if(MODO==='caio'){document.getElementById('trava').hidden=true;try{await entrar('')}catch(_){}return}
  try{sessionStorage.removeItem('painel-pw')}catch(_){}
  if(tentativas().n>=MAXT){travar();return}})();

// ===== atualizar pelo Sympla (só nas páginas do Caio, que têm o conector Sympla Gnarly) =====
const SYMPLA='Sympla Gnarly',TRIG='trig_01Mw6NTko5sT6MLUHgXiDc38';let MCP=null,ART=null;
const capP=(async()=>{try{MCP=await window.claude.use('mcp')}catch(_){}try{ART=await window.claude.use('artifact')}catch(_){}})();
async function mostraBotao(){await capP;const meu=!!MCP&&MODO==='caio'&&!!DADOS;document.getElementById('atualizar').hidden=!meu;document.getElementById('lib').hidden=!meu}
const NOMEP={colab:'Colaboradores · Festa do Michael',mjc:'Isaque · Metas do MJC',socios:'Sócios · ANTR e Nostalgias',lovatic:'Lovatic DLBR · Metas da Lovatic'};
document.getElementById('lib').addEventListener('click',async ev=>{const b=ev.target.closest('button[data-p]');if(!b||!MCP)return;b.disabled=true;
  try{await MCP.callTool('Claude Code Remote','fire_trigger',{trigger_id:TRIG,text:'LIBERAR '+b.dataset.p});
    snack('Liberando "'+NOMEP[b.dataset.p]+'". Em uns 5 minutos quem travou pode recarregar a página e digitar a senha de novo.')}
  catch(err){snack('Não consegui liberar agora ('+((err&&err.code)||'erro')+'). Tente de novo.')}
  setTimeout(()=>{b.disabled=false},60000)});
function erroTxt(e){const c=e&&e.code;
  if(c==='server_not_connected'||c==='needs_reauth')return 'Ligue o conector Sympla Gnarly em claude.ai › Conectores e tente de novo.';
  if(c==='approval_required'||c==='not_in_manifest')return 'Permita o uso do Sympla Gnarly quando o Claude perguntar e toque de novo.';
  if(c==='server_unavailable'||c==='upstream_error')return 'O Sympla não respondeu agora. Tente de novo em alguns segundos.';
  return 'Não consegui falar com o Sympla ('+(c||'erro')+').'}
function numeros(e){const c=calc(e);const v=c.pagantes+(c.sp?c.pagOB:0),lot=(c.tudoOB?0:c.lot)+(c.sp?c.lotOB:0);
  return {v,q:c.falta<=0?0:(c.tudoOB?c.nO:c.nP),x:lot?Math.max(0,lot-v):null,r7:r7De(e.vendas,hoje())}}
document.getElementById('atualizar').addEventListener('click',async()=>{
  const bt=document.getElementById('atualizar');if(!MCP||!DADOS)return;bt.disabled=true;
  const alvo=DADOS.evs.filter(e=>e.d>=hoje()&&e.doc&&e.doc.symplaId);let feitos=0,ok=0,erro=null;
  bt.textContent='Atualizando 0/'+alvo.length;
  const um=async ev=>{try{const e=normaliza(ev.doc);
      const r=await MCP.callTool(SYMPLA,'sympla_vendas',Object.assign({evento_id:e.symplaId},e.symplaConta?{conta:String(e.symplaConta)}:{}));
      const v=r&&r.payload!==undefined?r.payload:(r&&r.structuredContent);if(!v||!v.tipos)throw {code:'upstream_error'};
      const {a,cats}=agregaVendas(e,v);aplicarEm(e,a,cats,'Sympla direto');
      Object.assign(ev,numeros(e));ev.doc=slim(e);ok++}
    catch(err){erro=erro||err}feitos++;bt.textContent='Atualizando '+feitos+'/'+alvo.length};
  const fila=[...alvo];await Promise.all(Array.from({length:Math.min(3,fila.length)},async()=>{while(fila.length)await um(fila.shift())}));
  if(!ok){bt.disabled=false;bt.textContent='Atualizar agora';snack(erroTxt(erro));return}
  DADOS.gerado=new Date().toISOString();render(DADOS);
  // custos vêm da Entrada de Eventos: a tarefa agendada lê a Entrada + Sympla e republica todos os painéis
  try{await MCP.callTool('Claude Code Remote','fire_trigger',{trigger_id:TRIG});
    snack('Vendas atualizadas. Agora estou puxando os custos da Entrada de Eventos e atualizando os links dos sócios e do MJC: em uns 3 minutos a página recarrega sozinha.')}
  catch(err){
    try{BLOB=await fechar(DADOS,SENHA);
      const corpo=PRISTINE.replace(/(<script id="dados" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a1,a2)=>a1+JSON.stringify(BLOB)+a2);
      if(!ART)throw {code:'not_granted'};
      await ART.publish(SKEL+corpo+'</body></html>');
      snack('Vendas atualizadas só nesta página. Não consegui atualizar os links dos sócios e do MJC ('+((err&&err.code)||'erro')+'). Toque de novo daqui a pouco.')}
    catch(e2){snack('Atualizei só nesta tela ('+((e2&&e2.code)||'erro')+').')}}
  bt.disabled=false;bt.textContent='Atualizar agora'});
</script>

</body></html>
